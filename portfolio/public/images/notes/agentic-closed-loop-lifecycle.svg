<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280" role="img" aria-labelledby="title description">
  <title id="title">Agentic closed-loop development lifecycle</title>
  <desc id="description">Ten stages from product intent through investigation, specification, implementation, verification, bounded correction, human release decision, and documented outcome.</desc>
  <rect width="720" height="1280" fill="#fafafa"/>
  <style>
    .label { font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #111; }
    .number { font: 500 17px "SFMono-Regular", Consolas, monospace; fill: #555; letter-spacing: 1px; }
    .box { fill: #fff; stroke: #111; stroke-width: 2; }
    .arrow { fill: none; stroke: #555; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>

  <g transform="translate(70 40)">
    <g transform="translate(0 0)"><rect class="box" width="580" height="86"/><text class="number" x="24" y="33">01</text><text class="label" x="82" y="53">Product intent</text></g>
    <path class="arrow" d="M290 86 V116" marker-end="url(#arrow)"/>
    <g transform="translate(0 124)"><rect class="box" width="580" height="86"/><text class="number" x="24" y="33">02</text><text class="label" x="82" y="53">Investigation</text></g>
    <path class="arrow" d="M290 210 V240" marker-end="url(#arrow)"/>
    <g transform="translate(0 248)"><rect class="box" width="580" height="86"/><text class="number" x="24" y="33">03</text><text class="label" x="82" y="53">Specification</text></g>
    <path class="arrow" d="M290 334 V364" marker-end="url(#arrow)"/>
    <g transform="translate(0 372)"><rect class="box" width="580" height="86"/><text class="number" x="24" y="33">04</text><text class="label" x="82" y="53">Scoped implementation</text></g>
    <path class="arrow" d="M290 458 V488" marker-end="url(#arrow)"/>
    <g transform="translate(0 496)"><rect class="box" width="580" height="86"/><text class="number" x="24" y="33">05</text><text class="label" x="82" y="53">Quality gates</text></g>
    <path class="arrow" d="M290 582 V612" marker-end="url(#arrow)"/>
    <g transform="translate(0 620)"><rect class="box" width="580" height="86"/><text class="number" x="24" y="33">06</text><text class="label" x="82" y="45">Preview or release</text><text class="label" x="82" y="72">deployment</text></g>
    <path class="arrow" d="M290 706 V736" marker-end="url(#arrow)"/>
    <g transform="translate(0 744)"><rect class="box" width="580" height="86"/><text class="number" x="24" y="33">07</text><text class="label" x="82" y="53">Runtime verification</text></g>
    <path class="arrow" d="M290 830 V860" marker-end="url(#arrow)"/>
    <g transform="translate(0 868)"><rect class="box" width="580" height="86"/><text class="number" x="24" y="33">08</text><text class="label" x="82" y="53">Bounded correction</text></g>
    <path class="arrow" d="M290 954 V984" marker-end="url(#arrow)"/>
    <g transform="translate(0 992)"><rect class="box" width="580" height="86"/><text class="number" x="24" y="33">09</text><text class="label" x="82" y="53">Human release decision</text></g>
    <path class="arrow" d="M290 1078 V1108" marker-end="url(#arrow)"/>
    <g transform="translate(0 1116)"><rect class="box" width="580" height="86"/><text class="number" x="24" y="33">10</text><text class="label" x="82" y="53">Documented outcome</text></g>
  </g>
</svg>
