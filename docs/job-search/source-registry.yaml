version: 4
default_run_mode: AUTONOMOUS_CAMPAIGN
default_execution_model: HYBRID_AUTONOMOUS_WITH_HUMAN_FINAL_CLICK
autonomy_calibration_stage: false
strong_apply_readiness_threshold: 85
apply_readiness_threshold: 92
campaign_minimum_desired_new_submissions: 8
campaign_normal_target_new_submissions: 10
campaign_maximum_new_submissions: 13
p0_max_age_days: 7
p1_max_age_days: 14
campaign_minimum_plausible_inventory: 50
campaign_target_plausible_inventory: 100
human_submit_batch_minimum: 5
human_submit_batch_maximum: 10

submission_authorization:
  user_authorized_globally: true
  individual_application_approval_required: false

sources:
  indeed_ph:
    url: "https://ph.indeed.com/?from=gnav-jobseeker-profile--profile-one-frontend"
    enabled: true
    priority: P0
    discovery: true
    execution_mode: DISCOVERY_ONLY
    live_submit: false
    applicant_automation_policy: RESTRICTED
    policy_verified_at: "2026-08-12"
    policy_evidence: "https://www.indeed.com/legal?hl=en_US"
    note: "Indeed prohibits third-party automation of Indeed Apply. Never submit autonomously on Indeed; use a legitimate external employer destination only under that destination's own policy."

  linkedin:
    enabled: true
    priority: P0
    discovery: false
    execution_mode: DISCOVERY_ONLY
    live_submit: false
    applicant_automation_policy: RESTRICTED
    policy_verified_at: "2026-08-12"
    policy_evidence: "https://www.linkedin.com/legal/user-agreement"
    note: "LinkedIn prohibits unauthorized automated access and activity. Do not automate discovery or submission on LinkedIn."

  workable:
    url: "https://jobs.workable.com/"
    enabled: true
    priority: P0
    discovery: true
    execution_mode: AUTONOMOUS
    live_submit: true
    applicant_automation_policy: PERMITTED
    policy_verified_at: "2026-08-12"
    policy_evidence: "https://jobs.workable.com/terms"
    supporting_evidence: "https://help.workable.com/hc/en-us/articles/35293126257815-Managing-AI-assisted-and-automated-job-applications"
    note: "Candidate terms permit job search and application use and do not prohibit applicant-side automation; Workable explicitly documents handling AI-assisted and automated applications. Employer-specific declarations still govern each form."

  greenhouse:
    url: "https://job-boards.greenhouse.io/"
    enabled: true
    priority: P0
    discovery: true
    execution_mode: DISCOVERY_ONLY
    live_submit: false
    applicant_automation_policy: UNCLEAR
    policy_verified_at: "2026-08-12"
    policy_evidence: "https://my.greenhouse.io/users/agreement"
    supporting_evidence: "https://www.greenhouse.com/privacy-policy"
    note: "The MyGreenhouse account route expressly prohibits automated means, but that agreement defines its Services as MyGreenhouse. Current official material for unauthenticated public Greenhouse-hosted job-board forms does not affirmatively permit third-party applicant submission, so the direct form route is POLICY_UNCLEAR and live submission remains disabled."

  ashby:
    url: "https://jobs.ashbyhq.com/"
    enabled: true
    priority: P0
    discovery: true
    execution_mode: DISCOVERY_ONLY
    live_submit: false
    applicant_automation_policy: UNCLEAR
    policy_verified_at: "2026-08-12"
    policy_evidence: "https://www.ashbyhq.com/resources/terms"
    supporting_evidence: "https://www.ashbyhq.com/resources/privacy"
    note: "Ashby's public terms are customer-facing and do not establish applicant-side autonomous submission permission. Keep discovery-only."

  recruitee:
    enabled: true
    priority: P0
    discovery: true
    execution_mode: DISCOVERY_ONLY
    live_submit: false
