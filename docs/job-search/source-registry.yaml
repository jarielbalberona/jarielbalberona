version: 9
default_run_mode: AUTONOMOUS_CAMPAIGN
default_execution_model: HYBRID_AUTONOMOUS_WITH_HUMAN_FINAL_CLICK
autonomy_calibration_stage: false
strong_apply_readiness_threshold: 85
apply_readiness_threshold: 92
campaign_minimum_desired_new_submissions: 8
campaign_normal_target_new_submissions: 10
campaign_maximum_new_submissions: 13
p0_max_age_days: 7
p1_max_age_days: 30
p2_max_age_days: 45
campaign_minimum_plausible_inventory: 50
campaign_target_plausible_inventory: 100
human_submit_batch_minimum: 5
human_submit_batch_maximum: 10

submission_authorization:
  user_authorized_globally: true
  individual_application_approval_required: false

registry_policy:
  preferred_not_allowlist: true
  discover_additional_reputable_sources: true
  auto_add_reusable_sources: true
  new_source_checks: ["legitimacy", "source_type", "candidate_cost", "priority"]
  priority_affects_fit: false

candidate_paid_access:
  default_authorized: false
  free_profile_creation_allowed: true
  subscriptions_require_explicit_authorization: true
  proposal_credits_require_explicit_authorization: true
  boosted_applications_require_explicit_authorization: true

opportunistic_discovery:
  hard_blocked: false
  not_in_default_rotation: ["fiverr", "freelancer_com", "peopleperhour", "flexjobs", "hubstaff_talent", "remote_co", "galasya", "remotework_ph", "hireable_ph", "pinoy_jobs_online", "hireme_ph", "husay_ph", "pesojobs", "workmates_ph"]

